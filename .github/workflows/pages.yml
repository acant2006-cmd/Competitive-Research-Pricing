name: Publish pricing dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install laboratory
        working-directory: Mission_3_Pricing_Laboratory
        run: npm ci
      - name: Test laboratory
        working-directory: Mission_3_Pricing_Laboratory
        run: npm test
      - name: Build laboratory
        working-directory: Mission_3_Pricing_Laboratory
        run: npm run build
      - name: Add laboratory to Pages
        run: cp -R Mission_3_Pricing_Laboratory/dist dist/laboratory
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
